<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Открыть в приложении</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #111; --muted: #666; --btn: #00aaff; --btn-fg: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; } }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg);
         font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 420px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a.btn { display: block; margin: 0 0 12px; padding: 14px 16px; border-radius: 12px; background: var(--btn);
          color: var(--btn-fg); text-decoration: none; text-align: center; font-weight: 600; }
  a.alt { background: transparent; color: var(--btn); border: 1px solid var(--btn); }
</style>
</head>
<body>
<main>
  <h1>Открываю диалог в приложении…</h1>
  <p id="note">Если приложение не открылось, нажмите вариант ниже.</p>
  <div id="links"></div>
</main>
<script>
  // The chat ID comes only after "#": that part of the address is never sent to the server.
  (function () {
    var id = decodeURIComponent(location.hash.slice(1));
    var links = document.getElementById('links');
    var note = document.getElementById('note');
    if (!/^u2i[-_:][A-Za-z0-9_.~:-]{1,200}$/.test(id)) {
      note.textContent = 'В ссылке нет номера диалога.';
      return;
    }
    var q = encodeURIComponent(id);
    var variants = [
      ['Вариант 1', 'ru.avito://1/channel/details?channelId=' + q],
      ['Вариант 2', 'ru.avito://1/messenger/channel?channelId=' + q],
      ['Вариант 3', 'ru.avito://1/profile/messenger/channel/' + q],
      ['Список сообщений', 'ru.avito://1/channels'],
    ];
    variants.forEach(function (item, index) {
      var a = document.createElement('a');
      a.className = index ? 'btn alt' : 'btn';
      a.href = item[1];
      a.textContent = item[0];
      links.appendChild(a);
    });
    location.href = variants[0][1];
  })();
</script>
</body>
</html>
